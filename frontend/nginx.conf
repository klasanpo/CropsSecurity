server {
  listen 80;
  server_name _;

  location = /health {
    access_log off;
    return 200 'ok';
    add_header Content-Type text/plain;
  }

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}

