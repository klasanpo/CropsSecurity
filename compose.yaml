name: cropssecurity

services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "${CROPS_PORT:-1984}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/cropssecurity.db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    volumes:
      - crops_data:/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  worker:
    build:
      context: ./backend
    command: ["python", "-m", "crops_security.worker"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/cropssecurity.db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    volumes:
      - crops_data:/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "crops_security.worker_health"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  crops_data:
  redis_data:
